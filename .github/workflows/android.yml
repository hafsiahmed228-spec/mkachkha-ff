name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Icon & splash
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r assets/android-res/* android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp assets/splash.png {} \;

      - name: Sync
        run: npx cap sync android

      - name: Fixed signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MKACHKHA-FF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MKACHKHA-FF
          path: MKACHKHA-FF.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: MKACHKHA FF v1.${{ github.run_number }}
          body: |
            📲 حمّل **MKACHKHA-FF.apk** و ركّبو على التليفون.
          files: MKACHKHA-FF.apk
          make_latest: true
