<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MKACHKHA FF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d18;--glass:rgba(14,18,32,.82);--glass2:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);
  --text:#f3f5fa;--muted:#9aa3b8;--gold:#ffc83d;--gold2:#ff9f1c;--red:#ff3d4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#app.edit #c{height:47%}
button{font:inherit;color:inherit}
/* top bar */
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none}
.topbar>*{pointer-events:auto}
.logo{font-family:'Lalezar',sans-serif;font-size:24px;letter-spacing:1px;direction:ltr;line-height:1;
  background:linear-gradient(180deg,#fff1b8,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #7a2b00) drop-shadow(0 0 10px #ff9f1c55)}
.logo b{display:inline-block;margin-left:6px;padding:3px 7px 0;border-radius:8px;background:linear-gradient(180deg,#ff5b6a,#c4001c);
  color:#fff;-webkit-text-fill-color:#fff;font-weight:400;filter:none;box-shadow:0 2px 0 #6b0010}
.seg{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:3px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{border:none;background:none;padding:6px 12px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1600;box-shadow:0 2px 0 #8a4b00}
/* sheet (editor) */
#sheet{position:absolute;left:0;right:0;bottom:0;height:53%;z-index:15;display:none;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px #0008}
#app.edit #sheet{display:flex}
.sheetHead{display:flex;gap:6px;align-items:center;padding:10px 12px 4px}
.sheetHead input{flex:1;min-width:0;background:var(--glass2);border:1px solid var(--line);color:#fff;border-radius:12px;padding:7px 10px;font:inherit;font-size:14px;user-select:text;-webkit-user-select:text}
.ibtn{background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:16px;cursor:pointer;flex:0 0 auto}
.ibtn:active,.chip:active,.hbtn:active{transform:scale(.94)}
.ibtn.go{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1600;font-weight:800;font-size:13px;border:none;box-shadow:0 2px 0 #8a4b00}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--glass2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:#fff;color:#111;font-weight:800}
#panel{flex:1;overflow-y:auto;padding:4px 12px 20px;-webkit-overflow-scrolling:touch}
.group{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.group h3{margin:0 0 7px;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:13.5px;cursor:pointer}
.chip.on{border-color:var(--gold);background:#ffc83d22;color:var(--gold);font-weight:800}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px #0004}
.dot.on{border-color:#fff;transform:scale(1.1)}
.sw input[type=color]{width:34px;height:34px;border:none;background:none;padding:0;cursor:pointer}
.rangeRow{display:flex;align-items:center;gap:8px}
.rangeRow .lbl{font-size:12px;color:var(--muted);min-width:44px;text-align:center}
input[type=range]{flex:1;accent-color:var(--gold);height:28px}
textarea{width:100%;min-height:80px;background:var(--glass2);border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px;font:inherit;font-size:15px;resize:vertical;user-select:text;-webkit-user-select:text}
.bigbtn{width:100%;margin-top:8px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1600;border:none;border-radius:12px;padding:10px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #8a4b00}
.bigbtn.alt{background:var(--glass2);color:#fff;border:1px solid var(--line);font-weight:600;box-shadow:none}
.bigbtn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aiOut{white-space:pre-wrap;line-height:1.7;font-size:15px;margin-top:10px;user-select:text;-webkit-user-select:text}
.idea{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:14px}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.examples .chip{font-size:12px;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center;cursor:pointer;position:relative}
.card svg{width:100%;height:110px}
.card .nm{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .del{position:absolute;top:4px;left:4px;background:#000a;border:none;color:#fff;border-radius:8px;font-size:12px;cursor:pointer;padding:2px 6px}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #0004;border-top-color:#2a1600;border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
/* HUD */
#hud{display:none}
#app.world #hud{display:block}
#app.hidehud #hud>*:not(#showHud){display:none!important}
#app.hidehud .topbar{display:none}
#showHud{display:none;position:absolute;top:12px;left:12px;z-index:30}
#app.hidehud #showHud{display:block}
.roster{position:absolute;top:58px;left:10px;right:10px;display:flex;gap:8px;z-index:12;direction:ltr;overflow-x:auto;scrollbar-width:none;padding:2px}
.av{flex:0 0 auto;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#34405e,#151a2b);border:2px solid var(--line);overflow:hidden;position:relative;cursor:pointer;box-shadow:0 3px 8px #0006}
.av svg{position:absolute;width:150%;left:-25%;top:-6%}
.av img{position:absolute;height:520%;left:50%;transform:translateX(-50%);top:-6%}
.poseGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.poseCard{background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#fff}
.poseCard span{font-size:22px}.poseCard small{font-size:10.5px;color:var(--muted);line-height:1.2;text-align:center}
.poseCard.on{border-color:var(--gold);background:#ffc83d22}.poseCard.on small{color:var(--gold)}
.modal.bottom{justify-content:flex-end;background:linear-gradient(180deg,transparent 30%,#000a);padding:10px}
.modal.bottom .sheetList{max-height:58vh}
.av.on{border-color:var(--gold);box-shadow:0 0 0 2px #ffc83d55,0 3px 8px #0006}
.av.add{display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold);border-style:dashed}
.joy{position:absolute;left:22px;bottom:34px;width:128px;height:128px;border-radius:50%;z-index:12;touch-action:none;
  background:radial-gradient(circle,#ffffff14,#ffffff08 60%,transparent 61%),rgba(14,18,32,.45);border:2px solid #ffffff2a;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,#d9dde8);box-shadow:0 4px 10px #0007;pointer-events:none}
.acts{position:absolute;right:16px;bottom:30px;z-index:12;display:grid;grid-template-columns:repeat(2,56px);gap:10px;direction:ltr}
.hbtn{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:24px;cursor:pointer;box-shadow:0 3px 8px #0006;display:flex;align-items:center;justify-content:center;position:relative}
.hbtn small{position:absolute;bottom:-17px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
.hbtn.on{border-color:var(--gold);background:#ffc83d33}
.shutter{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:12;width:76px;height:76px;border-radius:50%;
  border:5px solid #fff;background:radial-gradient(circle,#fff 55%,#ffffffcc 56%);cursor:pointer;box-shadow:0 4px 14px #0008}
.shutter:active{transform:translateX(-50%) scale(.92)}
.rec{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:12;display:flex;gap:8px}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill.live{background:var(--red);border-color:var(--red);font-weight:800;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.emotes{position:absolute;right:16px;bottom:228px;z-index:13;display:none;flex-direction:column;gap:8px}
.emotes.open{display:flex}
.side{position:absolute;right:12px;top:112px;z-index:12;display:flex;flex-direction:column;gap:9px}
.side .hbtn{width:40px;height:40px;font-size:17px}
/* modal */
.modal{position:absolute;inset:0;z-index:60;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px}
.modal.open{display:flex}
.modal img,.modal video{max-width:100%;max-height:68vh;border-radius:16px;box-shadow:0 10px 40px #000}
.modal .mrow{display:flex;gap:10px;width:100%;max-width:420px}
.modal .mrow button{flex:1}
.sheetList{width:100%;max-width:460px;background:#151a2b;border:1px solid var(--line);border-radius:18px;padding:14px;max-height:80vh;overflow:auto}
.sheetList h2{margin:0 0 10px;font-size:17px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;transition:opacity .35s}
.flash.go{opacity:.85;transition:none}
.toast{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:70;white-space:nowrap}
.toast.show{opacity:1}
.hint{position:absolute;top:118px;left:12px;z-index:11;font-size:12px;color:#fffc;background:#0007;padding:5px 10px;border-radius:10px;max-width:60%}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:16px;z-index:99;background:var(--bg)}
</style>
</head>

</div>

const $=id=>document.getElementById(id);
const get=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
const set=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{a[k]=a[k]||{};a=a[k]});a[ks.at(-1)]=v;};
function toast(msg){const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900);}

/* ================= STATE ================= */
const DEFAULT = {
  name:"",
  head:{shape:"oval", w:1, h:1},

const OPTIONS = {

  "eyes.type":[["round","مدوّرين"],["almond","لوزة"],["sleepy","ناعسين"],["anime","أنمي"],["happy","فرحانين ^^"]],
  "brows.type":[["flat","مستقيمين"],["arched","مقوّسين"],["angry","غضبان"],["sad","حزين"],["none","بلاش"]],
  "nose.type":[["small","صغير"],["round","مدوّر"],["long","طويل"],["button","زرّ"]],
  "mouth.type":[["smile","يضحك"],["neutral","عادي"],["open","محلول"],["smirk","نصّ ضحكة"],["sad","زعفان"]],

};
const RANGES = {
  "head.w":[0.8,1.2],"head.h":[0.8,1.2],"ears.size":[0.6,1.5],

/* ================= DRAWING ================= */
function shade(hex,amt){ // amt -1..1
  let c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let n=parseInt(c,16), r=n>>16, g=(n>>8)&255, b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

let _cid=0;
function drawCharacter(s){
  const CID="tc"+(++_cid);
  const cx=150, cy=110;
  const W=s.body.weight, H=s.body.height, M=s.body.muscle;
  let rx=52*s.head.w*(1+W*0.14), ry=60*s.head.h;
  const sh=s.head.shape;
  if(sh==="round"){ry*=0.9; rx*=1.04}
  if(sh==="long"){rx*=0.84; ry*=1.1}
  if(sh==="oval"){rx*=0.92}
  const T=cy-ry, B=cy+ry, L=cx-rx, R=cx+rx;
  const skin=s.skin, skinD=shade(skin,-0.18), hairC=s.hair.color, hairD=shade(hairC,-0.25);
  const line="#1b1b1f";

  let headPath;
  if(sh==="square"){
    const r=22; headPath=`M${L+r},${T} H${R-r} Q${R},${T} ${R},${T+r} V${B-r*1.4} Q${R},${B} ${R-r*1.6},${B} H${L+r*1.6} Q${L},${B} ${L},${B-r*1.4} V${T+r} Q${L},${T} ${L+r},${T} Z`;
  } else if(sh==="heart"){
    headPath=`M${L},${cy-ry*0.15} C${L},${T-ry*0.12} ${R},${T-ry*0.12} ${R},${cy-ry*0.15} C${R},${cy+ry*0.55} ${cx+rx*0.32},${B} ${cx},${B} C${cx-rx*0.32},${B} ${L},${cy+ry*0.55} ${L},${cy-ry*0.15} Z`;

  }

  // ---- body metrics
  const neckW=22+W*18+M*6;
  const ty=B+14;
  const th=118*(0.85+H*0.32);
  const sx=(88+W*46+M*30)/2;
  const wx=(66+W*86)/2;
  const bul=W*26;
  const bot=ty+th;
  const legLen=128*(0.82+H*0.36);
  const legW=24+W*20+M*4;
  const legX=Math.max(14,wx*0.48);
  const footY=bot+legLen;
  const armW=16+W*14+M*12;
  const armLen=th*1.02;
  const top=s.outfit.top, tc=s.outfit.topColor, t2=s.outfit.top2;
  const out=[];

  // ground shadow
  out.push(`<ellipse cx="${cx}" cy="${footY+12}" rx="${60+W*30}" ry="9" fill="#000" opacity=".28"/>`);

  // ---- back hair
  if(s.hair.style==="long"){

  }
  // hoodie hood behind
  if(top==="hoodie"){
    out.push(`<path d="M${cx-rx*0.95},${B+20} Q${cx-rx*1.05},${B-24} ${cx},${B-16} Q${cx+rx*1.05},${B-24} ${cx+rx*0.95},${B+20} Z" fill="${shade(tc,-0.25)}"/>`);
  }

  // ---- legs
  for(const d of [-1,1]){
    const x=cx+d*legX;
    out.push(`<line x1="${x}" y1="${bot-4}" x2="${x+d*3}" y2="${footY-4}" stroke="${s.outfit.pants}" stroke-width="${legW}" stroke-linecap="round"/>`);
    out.push(`<line x1="${x+d*(legW*0.18)}" y1="${bot+20}" x2="${x+d*(legW*0.2)}" y2="${footY-14}" stroke="${shade(s.outfit.pants,-0.25)}" stroke-width="2" opacity=".5"/>`);
    out.push(`<ellipse cx="${x+d*(legW*0.35)}" cy="${footY+2}" rx="${legW*0.78}" ry="${9+W*2}" fill="${s.outfit.shoes}" stroke="${shade(s.outfit.shoes,-0.4)}" stroke-width="2"/>`);
  }
  // pelvis
  out.push(`<path d="M${cx-wx},${bot-10} L${cx+wx},${bot-10} L${cx+legX+legW/2},${bot+22} L${cx-legX-legW/2},${bot+22} Z" fill="${s.outfit.pants}"/>`);

  // ---- arms (behind torso edge)
  const arms=[];
  for(const d of [-1,1]){
    const x1=cx+d*(sx-armW*0.35), y1=ty+armW*0.55;
    const x2=cx+d*(Math.max(sx,wx+bul*0.6)+armW*0.25+6), y2=ty+armLen;
    const sleeveFrac = (top==="tshirt"||top==="jersey")?0.38:0.9;
    const xs=x1+(x2-x1)*sleeveFrac, ys=y1+(y2-y1)*sleeveFrac;
    arms.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${skin}" stroke-width="${armW*0.82}" stroke-linecap="round"/>`);
    const sc = top==="jersey"?tc:tc;
    arms.push(`<line x1="${x1}" y1="${y1}" x2="${xs}" y2="${ys}" stroke="${sc}" stroke-width="${armW}" stroke-linecap="round"/>`);
    if(top==="jersey") arms.push(`<line x1="${xs-(x2-x1)*0.04}" y1="${ys-(y2-y1)*0.04}" x2="${xs}" y2="${ys}" stroke="${t2}" stroke-width="${armW}" stroke-linecap="butt"/>`);
    if(top==="suit") arms.push(`<line x1="${xs}" y1="${ys}" x2="${xs+(x2-x1)*0.04}" y2="${ys+(y2-y1)*0.04}" stroke="#fff" stroke-width="${armW*0.85}"/>`);
    arms.push(`<circle cx="${x2}" cy="${y2+3}" r="${armW*0.52}" fill="${skin}" stroke="${skinD}" stroke-width="1.5"/>`);
  }

  // ---- torso
  const torso=`M${cx-sx},${ty+16} Q${cx-sx},${ty} ${cx-sx+18},${ty} L${cx+sx-18},${ty} Q${cx+sx},${ty} ${cx+sx},${ty+16} C${cx+sx+bul},${ty+th*0.38} ${cx+wx+bul},${ty+th*0.72} ${cx+wx},${bot} L${cx-wx},${bot} C${cx-wx-bul},${ty+th*0.72} ${cx-sx-bul},${ty+th*0.38} ${cx-sx},${ty+16} Z`;
  out.push(arms.join(''));
  out.push(`<defs><clipPath id="${CID}"><path d="${torso}"/></clipPath></defs>`);
  out.push(`<path d="${torso}" fill="${tc}"/>`);
  if(top==="jersey"){
    const sw=(sx*2)/7; let st='';
    for(let i=-4;i<=4;i+=2) st+=`<rect x="${cx+i*sw-sw/2}" y="${ty-5}" width="${sw}" height="${th+10}" fill="${t2}"/>`;
    out.push(`<g clip-path="url(#${CID})">${st}</g>`);
    out.push(`<path d="M${cx-neckW*0.7},${ty} Q${cx},${ty+18} ${cx+neckW*0.7},${ty}" fill="none" stroke="${t2}" stroke-width="5"/>`);
  }
  if(top==="tshirt"){
    out.push(`<path d="M${cx-neckW*0.7},${ty} Q${cx},${ty+16} ${cx+neckW*0.7},${ty}" fill="${skin}" stroke="${shade(tc,-0.3)}" stroke-width="3"/>`);
  }
  if(top==="hoodie"){
    out.push(`<g clip-path="url(#${CID})"><rect x="${cx-wx*0.7}" y="${ty+th*0.58}" width="${wx*1.4}" height="${th*0.26}" rx="10" fill="${shade(tc,-0.15)}"/></g>`);
    out.push(`<line x1="${cx-8}" y1="${ty+4}" x2="${cx-10}" y2="${ty+th*0.36}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`);
    out.push(`<line x1="${cx+8}" y1="${ty+4}" x2="${cx+10}" y2="${ty+th*0.36}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`);
  }
  if(top==="suit"){
    out.push(`<path d="M${cx-neckW*0.8},${ty} L${cx},${ty+th*0.48} L${cx+neckW*0.8},${ty} Z" fill="#fff"/>`);
    out.push(`<path d="M${cx-5},${ty+6} L${cx+5},${ty+6} L${cx+7},${ty+th*0.4} L${cx},${ty+th*0.47} L${cx-7},${ty+th*0.4} Z" fill="${t2}"/>`);
    out.push(`<path d="M${cx-neckW*0.8},${ty} L${cx-4},${ty+th*0.5} L${cx-sx*0.5},${ty+th*0.18} Z M${cx+neckW*0.8},${ty} L${cx+4},${ty+th*0.5} L${cx+sx*0.5},${ty+th*0.18} Z" fill="${shade(tc,-0.3)}"/>`);
    out.push(`<circle cx="${cx}" cy="${ty+th*0.62}" r="3" fill="${shade(tc,-0.5)}"/><circle cx="${cx}" cy="${ty+th*0.78}" r="3" fill="${shade(tc,-0.5)}"/>`);
  }
  // belly shade for weight
  if(W>0.5) out.push(`<g clip-path="url(#${CID})"><path d="M${cx-wx*0.8},${ty+th*0.75} Q${cx},${ty+th*0.95} ${cx+wx*0.8},${ty+th*0.75}" fill="none" stroke="#000" stroke-opacity=".15" stroke-width="3"/></g>`);
  // belt
  out.push(`<rect x="${cx-wx}" y="${bot-10}" width="${wx*2}" height="8" fill="${shade(s.outfit.pants,-0.45)}"/>`);

  // ---- neck
  out.push(`<rect x="${cx-neckW/2}" y="${B-16}" width="${neckW}" height="${ty-B+20}" rx="6" fill="${skinD}"/>`);
  if(top==="tshirt") out.push(`<path d="M${cx-neckW*0.7},${ty} Q${cx},${ty+16} ${cx+neckW*0.7},${ty}" fill="${skinD}"/>`);

  // ---- ears
  const es=s.ears.size;
  for(const d of [-1,1]){
    const ex=d<0?L+3:R-3;
    out.push(`<ellipse cx="${ex}" cy="${cy+6}" rx="${9*es}" ry="${14*es}" fill="${skin}" stroke="${skinD}" stroke-width="2"/>`);
    out.push(`<ellipse cx="${ex+d*1}" cy="${cy+6}" rx="${4*es}" ry="${8*es}" fill="${skinD}" opacity=".6"/>`);
  }

  // ---- head
  out.push(`<path d="${headPath}" fill="${skin}" stroke="${skinD}" stroke-width="2"/>`);
  if(W>0.55||s.cheeks){
    const op=s.cheeks?0.45:(W-0.5)*0.6;
    for(const d of [-1,1]) out.push(`<ellipse cx="${cx+d*rx*0.55}" cy="${cy+22}" rx="${11+W*5}" ry="${7+W*3}" fill="#ff6b6b" opacity="${op}"/>`);
  }
  if(W>0.65) out.push(`<path d="M${cx-rx*0.35},${B-4} Q${cx},${B+8} ${cx+rx*0.35},${B-4}" fill="none" stroke="${skinD}" stroke-width="2.5"/>`);

  // ---- eyes
  const sz=s.eyes.size, gap=20*s.eyes.gap*Math.min(1.1,s.head.w), ey=cy+2, ec=s.eyes.color;
  for(const d of [-1,1]){
    const x=cx+d*gap;
    const t=s.eyes.type;
    if(t==="happy"){
      out.push(`<path d="M${x-9*sz},${ey+3} Q${x},${ey-9*sz} ${x+9*sz},${ey+3}" fill="none" stroke="${line}" stroke-width="3.5" stroke-linecap="round"/>`);
      continue;
    }
    let wr=9*sz, hr=9*sz;
    if(t==="almond"){wr=11*sz;hr=6*sz}
    if(t==="anime"){wr=10*sz;hr=13*sz}
    if(t==="sleepy"){wr=10*sz;hr=7*sz}
    if(t==="almond") out.push(`<path d="M${x-wr},${ey} Q${x},${ey-hr*1.7} ${x+wr},${ey} Q${x},${ey+hr*1.5} ${x-wr},${ey} Z" fill="#fff" stroke="${line}" stroke-width="1.5"/>`);
    else out.push(`<ellipse cx="${x}" cy="${ey}" rx="${wr}" ry="${hr}" fill="#fff" stroke="${line}" stroke-width="1.5"/>`);
    const ir=t==="anime"?7*sz:5.4*sz, irY=t==="anime"?9.5*sz:ir;
    out.push(`<ellipse cx="${x}" cy="${ey+(t==='sleepy'?2:0)}" rx="${ir}" ry="${Math.min(irY,hr*1.05)}" fill="${ec}"/>`);
    out.push(`<circle cx="${x}" cy="${ey+(t==='sleepy'?2:0)}" r="${2.6*sz}" fill="#000"/>`);
    out.push(`<circle cx="${x+d*-2*sz+1.5*sz}" cy="${ey-2.5*sz}" r="${1.7*sz}" fill="#fff"/>`);
    if(t==="anime") out.push(`<circle cx="${x-2.5*sz}" cy="${ey+4*sz}" r="${1.1*sz}" fill="#fff"/>`);
    if(t==="sleepy") out.push(`<path d="M${x-wr-1},${ey} A${wr+1},${hr+1} 0 0 1 ${x+wr+1},${ey} Z" fill="${skin}" stroke="${line}" stroke-width="2"/>`);
    if(s.eyes.lashes){
      const ly=t==="sleepy"?ey:ey-hr*0.8;
      out.push(`<path d="M${x+d*wr*0.6},${ly} l${d*5},${-5} M${x+d*wr},${ey-hr*0.3} l${d*6},${-3}" stroke="${line}" stroke-width="2" stroke-linecap="round"/>`);
    }
  }

  // ---- brows
  const bt=s.brows.type, bw=3.5*s.brows.thick, by=ey-17*sz;
  if(bt!=="none") for(const d of [-1,1]){
    const x=cx+d*gap, inn=x-d*10, outr=x+d*10;
    let p;
    if(bt==="flat") p=`M${inn},${by} L${outr},${by}`;
    if(bt==="arched") p=`M${inn},${by+2} Q${x},${by-6} ${outr},${by+2}`;

    if(bt==="sad") p=`M${inn},${by-4} L${outr},${by+4}`;
    out.push(`<path d="${p}" fill="none" stroke="${hairD}" stroke-width="${bw}" stroke-linecap="round"/>`);
  }

  // ---- nose
  const ny=cy+20, nt=s.nose.type;
  if(nt==="small") out.push(`<path d="M${cx-2},${ny-8} Q${cx+5},${ny} ${cx-3},${ny+3}" fill="none" stroke="${skinD}" stroke-width="2.5" stroke-linecap="round"/>`);
  if(nt==="round") out.push(`<path d="M${cx-8},${ny+1} Q${cx-9},${ny-9} ${cx},${ny-8} Q${cx+9},${ny-9} ${cx+8},${ny+1} Q${cx},${ny+7} ${cx-8},${ny+1} Z" fill="${shade(skin,-0.08)}" stroke="${skinD}" stroke-width="2"/>`);
  if(nt==="long") out.push(`<path d="M${cx},${ey-4} L${cx+5},${ny+2} Q${cx},${ny+6} ${cx-4},${ny+3}" fill="none" stroke="${skinD}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`);
  if(nt==="button") out.push(`<ellipse cx="${cx}" cy="${ny}" rx="5" ry="4" fill="${shade(skin,-0.15)}"/>`);

  const bdt=s.beard.type, my=cy+37;
  if(bdt==="stubble") out.push(`<path d="M${L+6},${cy+8} Q${L+8},${B+2} ${cx},${B+3} Q${R-8},${B+2} ${R-6},${cy+8} Q${R-16},${cy+44} ${cx},${my-8} Q${L+16},${cy+44} ${L+6},${cy+8} Z" fill="${hairC}" opacity=".28"/>`);
  if(bdt==="full") out.push(`<path d="M${L+3},${cy+2} Q${L},${B+12} ${cx},${B+20} Q${R},${B+12} ${R-3},${cy+2} Q${R-14},${cy+30} ${cx+16},${my-10} Q${cx},${my-14} ${cx-16},${my-10} Q${L+14},${cy+30} ${L+3},${cy+2} Z" fill="${hairC}"/>`);
  if(bdt==="goatee") out.push(`<path d="M${cx-12},${my+6} Q${cx},${my+4} ${cx+12},${my+6} Q${cx+8},${B+12} ${cx},${B+14} Q${cx-8},${B+12} ${cx-12},${my+6} Z" fill="${hairC}"/>`);

  // ---- mouth
  const mt=s.mouth.type;
  if(mt==="smile") out.push(`<path d="M${cx-13},${my-2} Q${cx},${my+11} ${cx+13},${my-2}" fill="none" stroke="${line}" stroke-width="3" stroke-linecap="round"/>`);
  if(mt==="neutral") out.push(`<path d="M${cx-10},${my+1} L${cx+10},${my+1}" stroke="${line}" stroke-width="3" stroke-linecap="round"/>`);
  if(mt==="open") out.push(`<path d="M${cx-13},${my-3} Q${cx},${my-1} ${cx+13},${my-3} Q${cx+11},${my+15} ${cx},${my+15} Q${cx-11},${my+15} ${cx-13},${my-3} Z" fill="#5b1a1a" stroke="${line}" stroke-width="2"/><ellipse cx="${cx}" cy="${my+10}" rx="6" ry="3.5" fill="#e86a6a"/><rect x="${cx-9}" y="${my-2}" width="18" height="4" rx="1.5" fill="#fff"/>`);
  if(mt==="smirk") out.push(`<path d="M${cx-11},${my+2} Q${cx+3},${my+5} ${cx+13},${my-5}" fill="none" stroke="${line}" stroke-width="3" stroke-linecap="round"/>`);
  if(mt==="sad") out.push(`<path d="M${cx-12},${my+6} Q${cx},${my-5} ${cx+12},${my+6}" fill="none" stroke="${line}" stroke-width="3" stroke-linecap="round"/>`);
  if(bdt==="mustache"||bdt==="full") out.push(`<path d="M${cx},${my-7} Q${cx-10},${my-12} ${cx-20},${my-2} Q${cx-10},${my-4} ${cx},${my-3} Q${cx+10},${my-4} ${cx+20},${my-2} Q${cx+10},${my-12} ${cx},${my-7} Z" fill="${hairC}"/>`);

  // ---- front hair
  const hs=s.hair.style;
  const cap=(lift,fringe)=>`M${L-3},${cy-4} C${L-8},${T-lift} ${R+8},${T-lift} ${R+3},${cy-4} Q${R-6},${T+fringe} ${cx+rx*0.2},${T+fringe+4} Q${cx-rx*0.3},${T+fringe-6} ${L+8},${T+fringe+8} Q${L+1},${cy-14} ${L-3},${cy-4} Z`;
  if(hs==="short") out.push(`<path d="${cap(30,16)}" fill="${hairC}"/>`);
  if(hs==="buzz") out.push(`<path d="M${L+1},${cy-8} C${L-2},${T-14} ${R+2},${T-14} ${R-1},${cy-8} Q${cx},${T+10} ${L+1},${cy-8} Z" fill="${hairC}" opacity=".75"/>`);
  if(hs==="long") out.push(`<path d="${cap(32,18)}" fill="${hairC}"/><path d="M${L-3},${cy-6} Q${L-10},${cy+30} ${L-6},${B+20} L${L+6},${B+14} Q${L+2},${cy+10} ${L+8},${cy-10} Z M${R+3},${cy-6} Q${R+10},${cy+30} ${R+6},${B+20} L${R-6},${B+14} Q${R-2},${cy+10} ${R-8},${cy-10} Z" fill="${hairC}"/>`);
  if(hs==="bun") out.push(`<circle cx="${cx}" cy="${T-18}" r="18" fill="${hairC}"/><path d="M${L-2},${cy-4} C${L-6},${T-22} ${R+6},${T-22} ${R+2},${cy-4} Q${cx},${T+4} ${L-2},${cy-4} Z" fill="${hairC}"/>`);
  if(hs==="spiky"){
    let p=`M${L-3},${cy-2} `; const n=7;
    for(let i=0;i<=n;i++){const x=L-3+(rx*2+6)*i/n; const yb=T+6+Math.abs(i-n/2)*7; p+=`L${x},${yb} `; if(i<n) p+=`L${x+(rx*2+6)/n/2},${T-26+Math.abs(i-n/2)*6} `;}
    p+=`L${R+3},${cy-2} Q${cx},${T+18} ${L-3},${cy-2} Z`;
    out.push(`<path d="${p}" fill="${hairC}" stroke-linejoin="round"/>`);
  }
  if(hs==="curly"){
    let c=''; const n=11;
    for(let i=0;i<n;i++){const a=Math.PI*(1.05+0.9*i/(n-1)); c+=`<circle cx="${cx+Math.cos(a)*rx*1.02}" cy="${cy-8+Math.sin(a)*ry*0.98}" r="${15+ (i%2)*3}" fill="${hairC}"/>`;}
    c+=`<ellipse cx="${cx}" cy="${T+4}" rx="${rx*0.75}" ry="16" fill="${hairC}"/>`;
    out.push(c);
  }
  if(hs==="mohawk") out.push(`<path d="M${cx-10},${T+16} Q${cx-14},${T-40} ${cx},${T-44} Q${cx+14},${T-40} ${cx+10},${T+16} Z" fill="${hairC}"/>`);
  if(hs==="bald") out.push(`<ellipse cx="${cx-rx*0.35}" cy="${T+16}" rx="10" ry="5" fill="#fff" opacity=".25"/>`);

  // ---- glasses
  const g=s.acc.glasses;
  if(g!=="none"){
    const r=12*Math.max(1,sz*0.9);
    const fill=g==="sun"?'fill="#111" fill-opacity=".85"':'fill="#fff" fill-opacity=".12"';
    for(const d of [-1,1]){
      const x=cx+d*gap;
      if(g==="round") out.push(`<circle cx="${x}" cy="${ey}" r="${r}" ${fill} stroke="#222" stroke-width="3"/>`);
      else out.push(`<rect x="${x-r*1.15}" y="${ey-r*0.8}" width="${r*2.3}" height="${r*1.6}" rx="${g==='sun'?7:4}" ${fill} stroke="#222" stroke-width="3"/>`);
      out.push(`<line x1="${x+d*r*1.1}" y1="${ey-2}" x2="${d<0?L+2:R-2}" y2="${ey-4}" stroke="#222" stroke-width="3"/>`);
    }
    out.push(`<path d="M${cx-gap+r},${ey-1} Q${cx},${ey-7} ${cx+gap-r},${ey-1}" fill="none" stroke="#222" stroke-width="3"/>`);
  }

  // ---- hats
  const ht=s.acc.hat, hc=s.acc.hatColor;
  if(ht==="chechia"){
    out.push(`<path d="M${cx-rx*0.78},${T+16} L${cx-rx*0.66},${T-30} Q${cx},${T-40} ${cx+rx*0.66},${T-30} L${cx+rx*0.78},${T+16} Q${cx},${T+24} ${cx-rx*0.78},${T+16} Z" fill="${hc}" stroke="${shade(hc,-0.35)}" stroke-width="2"/>`);
    out.push(`<ellipse cx="${cx}" cy="${T-33}" rx="${rx*0.62}" ry="7" fill="${shade(hc,-0.2)}"/>`);
    out.push(`<path d="M${cx},${T-36} Q${cx+rx*0.5},${T-30} ${cx+rx*0.6},${T-8}" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>`);
  }
  if(ht==="cap"){
    out.push(`<path d="M${L-2},${T+20} C${L-4},${T-34} ${R+4},${T-34} ${R+2},${T+20} Z" fill="${hc}"/>`);
    out.push(`<path d="M${cx-rx*0.2},${T+18} Q${R+40},${T+10} ${R+44},${T+26} Q${R},${T+30} ${cx-rx*0.2},${T+24} Z" fill="${shade(hc,-0.25)}"/>`);
    out.push(`<circle cx="${cx}" cy="${T-20}" r="4" fill="${shade(hc,-0.3)}"/>`);
  }
  if(ht==="beanie"){
    out.push(`<path d="M${L-3},${T+22} C${L-6},${T-38} ${R+6},${T-38} ${R+3},${T+22} Z" fill="${hc}"/>`);
    out.push(`<rect x="${L-5}" y="${T+10}" width="${rx*2+10}" height="16" rx="7" fill="${shade(hc,-0.25)}"/>`);
    out.push(`<circle cx="${cx}" cy="${T-30}" r="10" fill="${shade(hc,0.3)}"/>`);
  }

  // viewBox
  const minY=Math.min(T-70, 0), maxY=footY+26;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 ${minY} 320 ${maxY-minY}">${out.join('')}</svg>`;

function clean(state){
  const out=structuredClone(DEFAULT);
  out.name=typeof state.name==="string"?state.name.slice(0,30):"";
  for(const p in OPTIONS){ const v=get(state,p); if(OPTIONS[p].some(o=>o[0]===v)) set(out,p,v); }
  for(const p in RANGES){ const v=parseFloat(get(state,p)); if(!isNaN(v)){const [a,b]=RANGES[p]; set(out,p,Math.max(a,Math.min(b,v)));} }
  for(const p of COLORS){ const v=get(state,p); if(typeof v==="string"&&/^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(v)) set(out,p,v); }
  for(const p of BOOLS){ const v=get(state,p); if(typeof v==="boolean") set(out,p,v); }
  const nb=parseInt(get(state,"outfit.number")); if(!isNaN(nb)) out.outfit.number=Math.max(0,Math.min(99,nb));
  const bn=get(state,"outfit.backName"); if(typeof bn==="string") out.outfit.backName=bn.slice(0,12);
  return out;
}
function deepMerge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])){ a[k]=deepMerge(a[k]||{},b[k]); } else a[k]=b[k]; } return a; }

let samplePromise=null;
function getSample(){ if(!samplePromise) samplePromise=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null); return samplePromise; }

function schemaText(){
  let t="Allowed fields (use ONLY these values):\n";
  for(const p in OPTIONS) t+=`- ${p}: one of ${OPTIONS[p].map(o=>o[0]).join(", ")}\n`;
  for(const p in RANGES) t+=`- ${p}: number ${RANGES[p][0]}..${RANGES[p][1]}\n`;
  for(const p of COLORS) t+=`- ${p}: hex color like #aabbcc\n`;
  for(const p of BOOLS) t+=`- ${p}: true/false\n`;
  t+="- name: short string\nNotes: body.weight 0=very thin 1=very fat; body.height 0=short 1=tall; 'chechia' is the traditional Tunisian red felt hat; 'jersey' is a striped football shirt (outfit.topColor + outfit.top2 stripes).\n- outfit.number: integer 0..99 (shirt number)\n- outfit.backName: short name printed on the back (max 12 chars)\n- voice.pitch / voice.rate change how the character sounds.";
  return t;
}
function geminiKey(){ try{ return localStorage.getItem('mkff.gemini')||''; }catch(e){ return ''; } }
async function gemini(prompt){
  const k=geminiKey(); if(!k) throw {code:"unavailable"};
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key='+encodeURIComponent(k),
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}]})});
  if(r.status===429) throw {code:"rate_limited"}; if(!r.ok) throw {code:"gemini_"+r.status};
  const j=await r.json(); return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}
async function aiText(prompt,onText){
  const sample=await getSample();
  if(sample){ const r=await sample(prompt,{modelTier:"default",onText:onText?({text})=>onText(text):undefined}); return r.text||''; }
  const t=await gemini(prompt); if(onText) onText(t); return t;
}
async function askJSON(prompt){
  const sample=await getSample();
  if(sample&&sample.json){ try{ return await sample.json(prompt,{modelTier:"default"}); }catch(e){ if(e&&e.code&&e.code!=="parse_error"&&e.code!=="invalid_json") throw e; } }
  const txt=await aiText(prompt+"\nReturn ONLY the JSON, no markdown.");
  const m=txt.match(/\{[\s\S]*\}/); if(!m) throw {code:"parse"}; return JSON.parse(m[0]);
}
function aiErr(e){
  if(e&&e.code==="not_granted") return "ما عطيتش الإذن للـ IA.";
  if(e&&e.code==="rate_limited") return "برشا طلبات، استنّى شوية و عاود.";
  if(e&&e.code==="unavailable") return "حطّ مفتاح Gemini (الفوق) باش تخدم الـ IA.";
  if(e&&String(e.code).startsWith("gemini_")) return "مفتاح Gemini فيه مشكل ("+e.code.slice(7)+"). ثبّت فيه.";
  return "صار مشكل، عاود جرّب.";
}

function clampBounds(p){ const b=MAPS[mapId].bounds;
  if(b.c){ const L=Math.hypot(p.x,p.z); if(L>b.c){ p.x*=b.c/L; p.z*=b.c/L; } }
  if(b.x){ p.x=Math.max(-b.x,Math.min(b.x,p.x)); }
  if(b.z){ p.z=Math.max(-b.z,Math.min(b.z,p.z)); }
  if(b.zMin!=null){ p.z=Math.max(b.zMin,Math.min(b.zMax,p.z)); } }

function lineUp(withSelfie){
  const a=chars[active];
  const toCam=new THREE.Vector3().subVectors(camera.position,a.pos).setY(0).normalize();
  const yaw=Math.atan2(toCam.x,toCam.z), right=new THREE.Vector3(toCam.z,0,-toCam.x);
  a.yaw=yaw; a.targetYaw=yaw;
  chars.forEach(c=>{ c.hugTarget=null; c.stance=null; c.look=true; });
  const others=chars.filter((c,i)=>i!==active); let offR=0, offL=0; const placed=[];
  others.forEach((c,k)=>{ const side=k%2===0?1:-1; const prev=placed.filter(p=>p.side===side).at(-1)?.c||a; const sp=(prev.width+c.width)/2*1.0+0.06;
    if(side>0) offR+=sp; else offL+=sp; c.pos.copy(a.pos).addScaledVector(right,side>0?offR:-offL); c.yaw=yaw; c.targetYaw=yaw; c.y=0; c.vy=0; placed.push({c,side,k}); });
  a.emote=withSelfie?'selfie':pick(['peace','crossed','hips','shh']);
  placed.forEach(p=>{ if(p.k<2){ p.c.emote=pick(['peace','idle','thumbs','crossed']); p.c.hugTarget=a; p.c.hugSide=-p.side; } else p.c.emote=pick(['peace','cheer','wave','crossed','flex']); });
  const r1=placed.find(p=>p.k===0); if(!withSelfie&&r1&&a.emote!=='crossed'){ a.hugTarget=r1.c; a.hugSide=r1.side; }
  const mid=a.pos.clone().addScaledVector(right,(offR-offL)/2);
  const maxH=Math.max(...chars.map(c=>c.height)), maxW=Math.max(...chars.map(c=>c.width)), halfW=(offR+offL)/2+maxW/2+0.18;
  duo={target:new THREE.Vector3(mid.x,withSelfie?maxH*0.78:maxH*0.53,mid.z),group:true};
  const dist=withSelfie?fitDist(halfW,maxH*0.25)*1.05:fitDist(halfW,maxH*0.6)*1.08;
  controls.target.copy(duo.target); camera.position.copy(duo.target).addScaledVector(toCam,dist).add(new THREE.Vector3(0,withSelfie?0.3:0.12,0));
}

/* =============== ANIMATION LOOP =============== */
const lerpAng=(a,b,t)=>{ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; };
const _f=new THREE.Vector3(), _r=new THREE.Vector3(), _mv=new THREE.Vector3();
function updateMove(dt){
  const e=chars[active];
  let jx=joy.x, jy=joy.y;
  if(keys['w']||keys['arrowup']) jy=-1; if(keys['s']||keys['arrowdown']) jy=1; if(keys['a']||keys['arrowleft']) jx=-1; if(keys['d']||keys['arrowright']) jx=1;
  const mag=Math.min(1,Math.hypot(jx,jy));
  chars.forEach(c=>{ if(c!==e) c.moving+= (0-c.moving)*Math.min(1,dt*10); });
  if(mode!=='world'||mag<0.12){ e.moving+=(0-e.moving)*Math.min(1,dt*10); return; }
  camera.getWorldDirection(_f); _f.y=0; _f.normalize(); _r.set(-_f.z,0,_f.x);
  _mv.copy(_f).multiplyScalar(-jy).addScaledVector(_r,jx); if(_mv.lengthSq()<1e-4) return; _mv.normalize();
  e.targetYaw=Math.atan2(_mv.x,_mv.z); e.moving+=(mag-e.moving)*Math.min(1,dt*10);
  const sp=2.6*mag*(1-e.s.body.weight*0.25);
  const before=e.pos.clone();
  e.pos.addScaledVector(_mv,sp*dt);
  for(const c of colliders){ const dx=e.pos.x-c.x, dz=e.pos.z-c.z, d=Math.hypot(dx,dz), min=c.r+0.3; if(d<min&&d>1e-4){ e.pos.x=c.x+dx/d*min; e.pos.z=c.z+dz/d*min; } }
  clampBounds(e.pos);
  if(e.emote) e.emote=null; e.hugTarget=null; e.stance=null;
  if(duo){ duo=null; chars.forEach(c=>{ c.emote=null; c.hugTarget=null; c.stance=null; }); }
  const dlt=e.pos.clone().sub(before); camera.position.add(dlt); controls.target.add(dlt);
}
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(0.05,clock.getDelta()), t=clock.elapsedTime;
  updateMove(dt);
  updateWorld(dt,t);
  chars.forEach(c=>animChar(c,dt,t));
  const a=chars[active];
  if(a){ ring.position.x=a.pos.x; ring.position.z=a.pos.z; ring.scale.setScalar(Math.max(0.8,a.width*1.1)); ring.visible=mode==='world'&&chars.length>1&&!recording;
    if(mode==='world'&&!duo){ const want=new THREE.Vector3(a.pos.x,a.height*0.55+a.y*0.5,a.pos.z); const d=want.sub(controls.target).multiplyScalar(Math.min(1,dt*6)); controls.target.add(d); camera.position.add(d); }
    sun.position.set(a.pos.x+6,11,a.pos.z+5); sun.target.position.set(a.pos.x,0,a.pos.z); charLight.position.set(a.pos.x,2.4,a.pos.z+1.2); }
  controls.update();
  composer.render();
  if(recording) drawRecFrame();
  requestAnimationFrame(loop);
}

async function saveBlob(blob,name){
  if(isNative){ try{ const FS=CAP.Plugins.Filesystem, SH=CAP.Plugins.Share; const data=await blobToB64(blob);
      let uri; try{ const w=await FS.writeFile({path:'MKACHKHA_FF/'+name,data,directory:'DOCUMENTS',recursive:true}); uri=w.uri; toast('تسجّلت في Documents/MKACHKHA_FF ✅'); }catch(e){ const w=await FS.writeFile({path:name,data,directory:'CACHE'}); uri=w.uri; }
      if(SH) await SH.share({title:'MKACHKHA FF',files:[uri]}).catch(()=>{}); }catch(e){ toast('ما تسجّلتش'); } return; }
  const dl=await getDL(); if(!dl){ toast('التحميل مش متوفّر هنا'); return; } try{ await dl.save({filename:name,data:blob}); toast('تسجّلت ✅'); }catch(e){ toast('ما تسجّلتش'); } }
function stamp(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`; }
function showMedia(m){
  const el=m.type==='img'?`<img src="${m.url}">`:`<video src="${m.url}" controls autoplay loop playsinline></video>`;
  const md=openModal(`${el}<div class="mrow"><button class="bigbtn" id="mSave">⬇️ سجّل</button><button class="bigbtn alt" id="mClose">رجوع</button></div>`);
  md.querySelector('#mClose').onclick=closeModal;
  md.querySelector('#mSave').onclick=async()=>{ const b=m.blob||await (await fetch(m.url)).blob(); saveBlob(b,`mkachkha_ff_${stamp()}.${m.type==='img'?'jpg':m.ext}`); };
}

// video
let recording=false, rec=null, recCv=null, recG=null, recChunks=[], recTimer=null;
function drawRecFrame(){ const s=renderer.domElement; if(recCv.width!==s.width||recCv.height!==s.height){ recCv.width=s.width; recCv.height=s.height; } recG.drawImage(s,0,0); watermark(recG,recCv.width,recCv.height); }
$('recBtn').onclick=()=>{
  if(recording){ rec.stop(); return; }
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream) return toast('الفيديو مش متوفّر في هالمتصفّح');
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm']; const type=types.find(t=>MediaRecorder.isTypeSupported(t));
  if(!type) return toast('الفيديو مش متوفّر هنا');
  recCv=document.createElement('canvas'); recG=recCv.getContext('2d'); drawRecFrame();
  try{ rec=new MediaRecorder(recCv.captureStream(30),{mimeType:type,videoBitsPerSecond:6e6}); }catch(e){ return toast('ما نجمتش نسجّل فيديو'); }
  recChunks=[]; rec.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
  rec.onstop=()=>{ recording=false; clearInterval(recTimer); $('recBtn').classList.remove('live'); $('recBtn').textContent='🎥 فيديو';
    const blob=new Blob(recChunks,{type:type.split(';')[0]}); const m={type:'vid',blob,url:URL.createObjectURL(blob),ext:type.includes('mp4')?'mp4':'webm'}; photos.unshift(m); showMedia(m); };
  rec.start(250); recording=true; let sec=0; $('recBtn').classList.add('live'); $('recBtn').textContent='⏹ 0s';
  recTimer=setInterval(()=>{ sec++; $('recBtn').textContent=`⏹ ${sec}s`; if(sec>=30) rec.stop(); },1000);
};

/* =============== VOICE & BUBBLES =============== */
let ttsP=null; const getTTS=()=>ttsP||(ttsP=(window.claude&&window.claude.use)?window.claude.use('tts').catch(()=>null):Promise.resolve(null));
function bubbleSprite(text){
  const c=document.createElement('canvas'); c.width=640; c.height=240; const g=c.getContext('2d');
  g.font='700 40px Cairo, sans-serif'; g.direction=/[؀-ۿ]/.test(text)?'rtl':'ltr';
  const words=text.split(/\s+/), lines=[]; let cur='';
  for(const w of words){ const tryL=cur?cur+' '+w:w; if(g.measureText(tryL).width>560&&cur){ lines.push(cur); cur=w; } else cur=tryL; } if(cur) lines.push(cur);
  const L=lines.slice(0,3); if(lines.length>3) L[2]=L[2].replace(/\s*\S*$/,'')+'…';
  const h=L.length*50+36, top=200-h;
  g.fillStyle='#ffffff'; g.strokeStyle='#14141c'; g.lineWidth=6; g.beginPath(); g.roundRect?g.roundRect(20,top,600,h,30):g.rect(20,top,600,h); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(290,top+h-3); g.lineTo(320,236); g.lineTo(350,top+h-3); g.fill(); g.beginPath(); g.moveTo(290,top+h); g.lineTo(320,236); g.lineTo(350,top+h); g.stroke();
  g.fillStyle='#14141c'; g.textAlign='center'; g.textBaseline='middle'; L.forEach((l,i)=>g.fillText(l,320,top+18+25+i*50));
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthWrite:false,depthTest:false,transparent:true,toneMapped:false})); sp.renderOrder=10; sp.scale.set(1.3,0.49,1); return sp;
}
function showBubble(e,text){ hideBubble(e); e.bubble=bubbleSprite(text); e.bubble.position.y=e.height+(e.tag&&showTags?0.55:0.4); e.obj.add(e.bubble); }
function hideBubble(e){ if(e.bubble){ e.obj.remove(e.bubble); e.bubble.material.map.dispose(); e.bubble.material.dispose(); e.bubble=null; } }
let speakToken=0;
async function speakChar(e,text){
  text=(text||'').trim().slice(0,300); if(!text) return;
  const my=++speakToken; chars.forEach(c=>{ c.talking=false; hideBubble(c); });
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(err){}
  showBubble(e,text); e.talking=true;
  const pitch=e.s.voice?.pitch??1, rate=e.s.voice?.rate??1, ar=/[؀-ۿ]/.test(text);
  const minDur=900+text.length*55;
  const t0=performance.now();
  const finish=async()=>{ const left=minDur*0.6-(performance.now()-t0); if(left>0) await new Promise(r=>setTimeout(r,left)); if(my===speakToken){ e.talking=false; setTimeout(()=>{ if(my===speakToken) hideBubble(e); },700); } };
  try{
    const N=isNative&&CAP.Plugins.TextToSpeech;
    if(N){ await N.speak({text,lang:ar?'ar-SA':'fr-FR',rate:Math.max(0.5,Math.min(1.6,rate)),pitch,volume:1,category:'ambient'}); return finish(); }
    const T=await getTTS();
    if(T){ await T.speak(text,{voice:pitch>1.15?'airy':pitch<0.85?'rounded':'buttery',rate:Math.max(0.7,Math.min(1.5,rate)),...(ar?{language:'ar'}:{})}); return finish(); }
    if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
      await new Promise(res=>{ const u=new SpeechSynthesisUtterance(text); u.lang=ar?'ar-SA':'fr-FR'; u.pitch=Math.max(0.1,Math.min(2,pitch)); u.rate=rate;
        const vs=speechSynthesis.getVoices(); const v=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(ar?'ar':'fr')); if(v) u.voice=v;
        u.onend=res; u.onerror=res; setTimeout(res,minDur*2.5+3000); speechSynthesis.speak(u); });
      return finish();
    }
  }catch(err){}
  await new Promise(r=>setTimeout(r,minDur)); finish();
}

      const res=await askJSON(`Characters: ${JSON.stringify(cast)}\nPlace: ${MAPS[mapId].name}${night?' at night':''}.${topic?`\nTopic: ${topic}`:''}\nWrite a short funny dialogue (4-6 lines) between these characters in Tunisian Darija (Arabic script), good for a YouTube Short. Each line max 14 words. Return JSON: {"lines":[{"who":<id>,"text":"..."}]}`);
      closeModal(); lineUp(false); chars.forEach(c=>c.emote=null);
      for(const ln of (res.lines||[]).slice(0,8)){ const c=chars[ln.who]; if(!c) continue; c.emote=Math.random()<0.4?'wave':null; await speakChar(c,ln.text); c.emote=null; await new Promise(r=>setTimeout(r,250)); }
    }catch(err){ const n=m.querySelector('#tkMsg'); if(n) n.textContent=aiErr(err); dl.disabled=false; dl.textContent='💬 حوار بيناتهم (IA)'; } };
